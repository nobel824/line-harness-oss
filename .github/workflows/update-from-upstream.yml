name: Update from upstream

# フォークを本体 Shudesu/line-harness-oss に追従させる唯一の正規経路。
#
# なぜ self-update (@line-harness/update-engine) ではないのか:
#   update-engine は本体の GitHub Releases のビルド済み成果物で Worker と管理画面を
#   丸ごと置換する (packages/update-engine/src/phases/apply.ts)。このフォークの独自機能
#   (フォーム管理 UI / webhook dedup) が消えるため、本体自身が fork 判定で 409 を返して
#   無効化している (apps/worker/src/routes/admin-update.ts, docs/wiki/26-Manual-Update.md)。
#   カスタマイズしているフォークにとっては git 同期だけが正しい。
#
# 方針: 綺麗に通るときはデプロイまで完全自動。引っかかったら必ず PR にして人間へ渡す。
#       どの経路を通っても「黙って死んで誰も気づかない」を作らない — 想定外の失敗は
#       最後の notify ステップが Issue にする。仕様: tasks/requirements-auto-upstream-sync.md
#
# 大きい/上流由来のテキスト (コンフリクト一覧・SQL・CI ログ) は GITHUB_OUTPUT を経由させず
# ファイルで受け渡す。heredoc の終端衝突とスクリプト展開の両方を避けるため。

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write # 想定外失敗の通知先
  actions: write # マージ後にデプロイを dispatch するため

concurrency:
  group: update-from-upstream
  cancel-in-progress: false

env:
  # gh は fork ではリモートを辿って upstream (Shudesu) を既定リポジトリに選ぶ。
  # --repo を付け忘れた gh 呼び出しは本体に向いて 403 で落ちる（実際に初回実行で
  # `gh workflow run` が Shudesu 宛に飛んでデプロイが起動しなかった）。個々のコマンドに
  # --repo を足すやり方は、次に gh を足す人が同じ罠を踏むので、ここで全体を固定する。
  GH_REPO: ${{ github.repository }}
  # マージのコンフリクトを自動解決してよいファイル = 決定論的な生成物だけ。
  # bootstrap.sql / bootstrap-meta.json は packages/db/scripts/generate-bootstrap.mjs の
  # 生成物で、フォークと本体の双方が migration を足すたび再生成するため構造的に毎回衝突する。
  # ここに列挙されていないファイルの衝突は「どちらを採るか」の判断が要る = 人間へ回す。
  GENERATED_FILES: 'packages/db/bootstrap-meta.json packages/db/bootstrap.sql pnpm-lock.yaml'

jobs:
  update:
    if: github.repository != 'Shudesu/line-harness-oss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 本体が .github/workflows/* を変更した回は、GITHUB_TOKEN では push が
          #   refusing to allow a GitHub App to create or update workflow
          #   `.github/workflows/xxx.yml` without `workflows` permission
          # で拒否される。permissions: contents: write を付けても効かない（GitHub App
          # トークンに workflow 権限を与える手段が無い）。この経路では draft PR すら
          # 作れず、Issue にコメントが積まれるだけで同期が完全に止まる — 実際に
          # 2026-08-01〜08-16 の 17 日間これで死んでいた。
          # UPSTREAM_SYNC_TOKEN = workflow 権限を持つ PAT。未設定なら従来どおり
          # GITHUB_TOKEN で動く（workflow 以外の同期はそれで通る）。
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # PAT が切れると push が 403 になり、同期は「毎日失敗するが誰も見ない」状態に戻る。
      # 期限は発行画面でしか見えず忘れるので、毎回 API から読んで残り 30 日で 1 度だけ鳴らす。
      # ここが失敗しても同期本体は止めない (continue-on-error)。
      - name: Warn before the sync PAT expires
        if: secrets.UPSTREAM_SYNC_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # 有効期限はレスポンスヘッダにしか出ない。無期限の PAT ではヘッダごと無い。
          exp="$(gh api -i user 2>/dev/null \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1) == "github-authentication-token-expiration" { print $2; exit }')"
          if [ -z "$exp" ]; then
            echo "No expiration header — the PAT does not expire. Nothing to warn about."
            exit 0
          fi
          echo "Sync PAT expires at: $exp"

          exp_epoch="$(date -u -d "$exp" +%s 2>/dev/null || true)"
          if [ -z "$exp_epoch" ]; then
            echo "Could not parse '$exp' — skipping the expiry check."
            exit 0
          fi
          days=$(( (exp_epoch - $(date -u +%s)) / 86400 ))
          echo "Days remaining: $days"
          if [ "$days" -gt 30 ]; then
            exit 0
          fi

          label="upstream-sync-token-expiry"
          gh label create "$label" --color FBCA04 --description "同期用 PAT の期限切れ警告" 2>/dev/null || true
          # 既に立っていれば黙る。30 日間毎日コメントすると通知が意味を失う。
          existing="$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open — not adding noise."
            exit 0
          fi

          {
            echo "upstream 同期に使っている PAT (\`UPSTREAM_SYNC_TOKEN\`) の有効期限まで **残り ${days} 日** です（期限: ${exp}）。"
            echo
            echo "切れると本体追従の push が 403 で拒否され、同期が黙って止まります。新しい PAT を発行して Secrets を差し替えてください。"
            echo
            echo "- 手順: \`tasks/requirements-auto-upstream-sync.md\` の「同期用 PAT」"
            echo "- 実行ログ: $RUN_URL"
            echo
            echo "差し替えたらこの Issue を close してください。"
          } > /tmp/expiry.md
          gh issue create --title "⏳ upstream 同期用 PAT の有効期限が近づいています" --label "$label" --body-file /tmp/expiry.md

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Shudesu/line-harness-oss.git
          git fetch upstream main

      - name: Detect upstream changes
        id: detect
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already up to date with upstream/main."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git log --oneline HEAD..upstream/main | head -30
          fi

      # status: clean | resolved | conflict | failed
      # ステップが想定外に落ちると status は空のまま → decide が 'internal' として扱う。
      # 「出力が無い = 正常」と解釈させないための sentinel。
      - name: Merge upstream, auto-resolving generated files
        id: merge
        if: steps.detect.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          branch="upstream/update-$(date -u +%Y%m%d-%H%M%S)"
          base="$(git rev-parse HEAD)"
          git switch -c "$branch"
          {
            echo "branch=$branch"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

          if git merge --no-edit upstream/main; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -z "$conflicts" ]; then
            # マージはコンテンツ衝突以外の理由で失敗している (index が汚れている等)。
            # 「衝突ファイル 0 件 = 解決すべきものが無い = 成功」と誤読すると、何も
            # マージされていない木を緑判定して本番に流してしまう。明示的に失敗させる。
            echo "git merge failed without content conflicts — treating as a hard failure."
            git merge --abort || true
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Conflicted files:"
          echo "$conflicts"
          echo "$conflicts" > /tmp/conflicts.txt

          unresolvable=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case " $GENERATED_FILES " in
              *" $f "*) ;;
              *) unresolvable="${unresolvable}${f} " ;;
            esac
          done <<< "$conflicts"

          if [ -n "$unresolvable" ]; then
            echo "Conflicts outside the generated-file allowlist: $unresolvable"
            # コンフリクトマーカーごとコミットして push する。人間が解決するための材料。
            # PR は draft にして誤マージを防ぐ。
            git add -A
            git commit -m "merge upstream/main (CONFLICTS — manual resolution required)"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 生成物のみ → いったん本体側を採用し、次のステップで再生成して正とする
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git checkout --theirs -- "$f" 2>/dev/null || git checkout upstream/main -- "$f"
            git add -- "$f"
          done <<< "$conflicts"
          echo "status=resolved" >> "$GITHUB_OUTPUT"

      - name: Regenerate generated files and complete the merge
        id: regen
        if: steps.merge.outputs.status == 'clean' || steps.merge.outputs.status == 'resolved'
        # 失敗しても job を止めない — decide に理由を届けて PR を作らせるため。
        continue-on-error: true
        run: |
          set -o pipefail
          # 失敗したら PR 本文にこのログを載せる。ci ステップは regen 失敗時に
          # スキップされて /tmp/ci.log を作らないため、regen は自前のログを持つ。
          run_regen() {
            set -e
            pnpm install --no-frozen-lockfile
            node packages/db/scripts/generate-bootstrap.mjs
          }
          run_regen 2>&1 | tee /tmp/regen.log
          # shellcheck disable=SC2086  # 複数パスへ意図的に単語分割する
          git add -- $GENERATED_FILES

          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit -m "chore(db): regenerate bootstrap after upstream merge"
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unmerged paths remain after auto-resolution: $remaining"
            exit 1
          fi
          echo "Merge completed cleanly."

      - name: Gate — destructive data operations in new migrations
        id: migscan
        if: steps.regen.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          new="$(git diff --name-only --diff-filter=A "${MERGE_BASE}" HEAD -- packages/db/migrations/ | tr '\n' ' ')"
          echo "New migrations: ${new:-（なし）}"
          if [ -z "${new// /}" ]; then
            exit 0
          fi
          # D1 の migration は戻せない (packages/update-engine/src/phases/rollback.ts)。
          # DELETE/DROP/TRUNCATE/UPDATE/REPLACE INTO を含むものは無人で本番に流さない。
          # shellcheck disable=SC2086  # 複数の migration パスへ意図的に単語分割する
          pnpm exec tsx scripts/check-migration-data-safety.ts $new | tee /tmp/mig-report.md
          exit "${PIPESTATUS[0]}"
        env:
          MERGE_BASE: ${{ steps.merge.outputs.base }}

      - name: CI — typecheck, test, build
        id: ci
        if: steps.regen.outcome == 'success'
        continue-on-error: true
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}
        run: |
          set -o pipefail
          run_ci() {
            set -e
            # worker の tsc は依存を dist 経由で解決するため、先にビルドしないと
            # stale な .d.ts を見て偽エラーを出す。
            pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db --filter @line-harness/update-engine build
            pnpm --filter worker typecheck
            pnpm --filter worker test
            pnpm --filter @line-crm/db test
            pnpm test:scripts
            pnpm --filter worker build
          }
          run_ci 2>&1 | tee /tmp/ci.log

      - name: Decide outcome
        id: decide
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          reason=""
          case "${{ steps.merge.outputs.status }}" in
            clean|resolved) ;;
            conflict) reason="conflict" ;;
            failed)   reason="failed" ;;
            # 空 = merge ステップが想定外に落ちた。正常扱いにはしない。
            *)        reason="internal" ;;
          esac
          if [ -z "$reason" ]; then
            if [ "${{ steps.regen.outcome }}" != "success" ]; then
              reason="regen"
            elif [ "${{ steps.migscan.outcome }}" != "success" ]; then
              reason="migration"
            elif [ "${{ steps.ci.outcome }}" != "success" ]; then
              reason="ci"
            fi
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Outcome: ${reason:-auto-merge}"

      # ── 全部緑 → main へマージして本番デプロイまで自動 ──────────────────
      # has_changes を再度見るのは必須: decide がスキップされると reason は空文字になり、
      # 「全部緑」と同じ値になってしまう（スキップ = 成功ではない）。
      - name: Auto-merge to main
        if: steps.detect.outputs.has_changes == 'true' && steps.decide.outcome == 'success' && steps.decide.outputs.reason == ''
        run: |
          set -e
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "${MERGE_BASE}")" ]; then
            echo "Nothing was actually merged — refusing to report success."
            exit 1
          fi
          # squash ではなく merge commit を push する。squash すると upstream の履歴が
          # 祖先から消え、次回以降の `git merge upstream/main` が毎回全コミットを
          # 再マージしようとして恒久的にコンフリクトする。
          git push origin HEAD:main
          echo "Merged $(git rev-parse --short "${MERGE_BASE}")..$(git rev-parse --short HEAD) into main."
        env:
          MERGE_BASE: ${{ steps.merge.outputs.base }}

      # PAT で push した場合は deploy-*.yml の `push: branches: [main]` が普通に発火する
      # ので、ここで dispatch すると同じデプロイが二重に走る。worker のデプロイは D1
      # migration を適用するため、二重起動は「両方が未適用と判断して同じ migration を
      # 2 回当てる」競合になりうる (duplicate column で落ちる)。PAT が無い＝
      # GITHUB_TOKEN で push した回だけ明示起動する。
      - name: Trigger production deploys (GITHUB_TOKEN fallback only)
        if: >-
          steps.detect.outputs.has_changes == 'true' &&
          steps.decide.outcome == 'success' &&
          steps.decide.outputs.reason == '' &&
          secrets.UPSTREAM_SYNC_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # GitHub は GITHUB_TOKEN による push ではワークフローを発火させない (再帰防止)。
          # workflow_dispatch と repository_dispatch だけが例外なので、デプロイは明示起動する。
          # これが無いとコードだけ main に進んで本番が古いまま取り残される。
          # --repo は GH_REPO と二重の保険。本体 Shudesu へ絶対に飛ばさない。
          gh workflow run deploy-cloudflare-worker.yml --repo "${{ github.repository }}" --ref main
          gh workflow run deploy-cloudflare-admin.yml --repo "${{ github.repository }}" --ref main
          echo "Dispatched worker + admin deploys."

      - name: Note auto-triggered deploys (PAT push)
        if: >-
          steps.detect.outputs.has_changes == 'true' &&
          steps.decide.outcome == 'success' &&
          steps.decide.outputs.reason == '' &&
          secrets.UPSTREAM_SYNC_TOKEN != ''
        run: |
          echo "Pushed with UPSTREAM_SYNC_TOKEN — deploy-cloudflare-{worker,admin}.yml"
          echo "fire from their own push trigger. Not dispatching to avoid double deploys."

      # ── 引っかかった → PR にして人間へ ────────────────────────────────
      - name: Open PR for manual review
        if: >-
          steps.decide.outputs.reason == 'conflict' ||
          steps.decide.outputs.reason == 'migration' ||
          steps.decide.outputs.reason == 'ci' ||
          steps.decide.outputs.reason == 'regen'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.decide.outputs.reason }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          MERGE_BASE: ${{ steps.merge.outputs.base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          # regen が commit 到達前に落ちた場合、マージは index に残ったままで未コミット。
          # そのまま push すると main と同一 commit になり `gh pr create` が
          # "No commits between" で失敗して PR が 1 つも残らない — 直そうとしている
          # サイレント失敗そのものになる。ここで必ずコミットしてから push する。
          if [ -f .git/MERGE_HEAD ]; then
            git add -A
            git commit -m "merge upstream/main (automation halted: ${REASON})"
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "${MERGE_BASE}")" ]; then
            echo "No commits to put in a PR — escalating to the notifier."
            exit 1
          fi
          git push origin "$BRANCH"

          draft="--draft"
          case "$REASON" in
            conflict)
              title="⚠️ upstream 同期: コンフリクトのため手動対応が必要"
              summary="自動マージが**生成ファイル以外**で衝突しました。どちらを採るかの判断が要るため自動適用を止めています。このブランチにはコンフリクトマーカーがそのまま入っています（解決の材料）。"
              body_file=/tmp/conflicts.txt
              body_title="コンフリクトしたファイル"
              fence="text"
              ;;
            migration)
              title="🛑 upstream 同期: 本番データを操作する migration を含みます"
              summary="新しい migration に**戻せない**データ操作が含まれています。内容を確認してからマージしてください。マージすれば通常どおりデプロイされます。"
              body_file=/tmp/mig-report.md
              body_title="検出された操作"
              fence=""
              draft=""
              ;;
            ci)
              title="❌ upstream 同期: CI が失敗"
              summary="マージ自体は成功しましたが、typecheck / test / build のいずれかが失敗したため自動適用を止めています。"
              body_file=/tmp/ci.log
              body_title="CI ログ（末尾）"
              fence="text"
              ;;
            regen)
              title="❌ upstream 同期: 生成ファイルの再生成に失敗"
              summary="生成ファイルの自動解決に失敗しました。マージは未完成のままコミットしてあります。"
              # ci ステップは regen 失敗時にスキップされ /tmp/ci.log を作らないので、
              # ここで参照するのは regen 自身のログでなければならない。
              body_file=/tmp/regen.log
              body_title="再生成ログ（末尾）"
              fence="text"
              ;;
          esac

          {
            echo "$summary"
            echo
            if [ -s "$body_file" ]; then
              echo "### $body_title"
              if [ -n "$fence" ]; then
                echo '```'"$fence"
                tail -c 4000 "$body_file"
                echo '```'
              else
                cat "$body_file"
              fi
              echo
            fi
            echo "---"
            echo "- 実行ログ: $RUN_URL"
            echo "- 仕様: \`tasks/requirements-auto-upstream-sync.md\`"
            echo "- このPRは squash せず **merge commit** で取り込むこと（upstream の履歴を祖先に残すため）。"
          } > /tmp/pr-body.md

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body-file /tmp/pr-body.md \
            $draft

      # ── どの経路でも拾えなかった失敗 → Issue で必ず可視化 ────────────────
      # 元インシデントは「毎日失敗しているのに誰も気づかない」だった。赤い X が
      # Actions タブに積まれるだけでは気づけないことが実証済みなので、最後に必ず鳴らす。
      - name: Notify on unexpected failure
        if: failure() || steps.decide.outputs.reason == 'failed' || steps.decide.outputs.reason == 'internal'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.decide.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          label="upstream-sync-failure"
          gh label create "$label" --color B60205 --description "upstream 自動同期の失敗" 2>/dev/null || true

          # 行頭のインデントを入れないこと — Markdown が字下げをコードブロックとして拾う。
          {
            echo "upstream の自動同期が失敗しました（理由: \`${REASON:-unexpected}\`）。自動での本番反映は行われていません。"
            echo
            echo "- 実行ログ: $RUN_URL"
            echo "- 仕様: \`tasks/requirements-auto-upstream-sync.md\`"
            echo
            echo "同じ失敗が続く間、この Issue にコメントが追記されます。直ったら close してください。"
          } > /tmp/issue-body.md

          existing="$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue-body.md
          else
            gh issue create --title "🚨 upstream 自動同期が失敗しています" --label "$label" --body-file /tmp/issue-body.md
          fi

      - name: No upstream changes
        if: steps.detect.outputs.has_changes == 'false'
        run: echo "Fork is already up to date with upstream/main."
